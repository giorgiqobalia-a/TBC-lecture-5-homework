<!DOCTYPE html>
<html lang="ka">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>მინი ვიქტორინა (Trivia Quiz)</title>
    <script src="https://tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 md:p-8">

        <!-- სათაური და ქულების პანელი -->
        <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-6">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-white">🧠 მინი ვიქტორინა</h1>
                <p id="progress-text" class="text-xs text-slate-400 mt-1">იტვირთება კითხვები...</p>
            </div>
            <div class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-right">
                <span class="text-xs text-slate-400 block uppercase font-semibold">ქულა</span>
                <span id="score-display" class="text-xl font-bold text-emerald-400">0</span>
            </div>
        </div>

        <!-- ჩატვირთვის / შეცდომის სტატუსი -->
        <div id="status-box" class="text-center py-8 text-slate-400">
            ⏳ კითხვები იტვირთება ინტერნეტიდან...
        </div>

        <!-- ქვიზის მთავარი ბარათი (თავიდან დამალულია) -->
        <div id="quiz-container" class="hidden space-y-6">
            <!-- კითხვის ტექსტი -->
            <div class="bg-slate-900/80 border border-slate-700/60 rounded-xl p-5">
                <span id="category-badge"
                    class="inline-block text-xs bg-sky-500/10 text-sky-400 border border-sky-500/20 px-2.5 py-0.5 rounded-full mb-3">
                    კატეგორია
                </span>
                <h2 id="question-text" class="text-lg font-semibold text-white leading-relaxed">
                    აქ გამოჩნდება კითხვა...
                </h2>
            </div>

            <!-- სავარაუდო პასუხების ღილაკები (JS-ით ჩაჯდება) -->
            <div id="answers-container" class="space-y-3">
                <!-- პასუხების ღილაკები -->
            </div>

            <!-- შემდეგი კითხვის ღილაკი -->
            <div class="flex justify-end pt-2">
                <button id="next-btn"
                    class="hidden bg-sky-600 hover:bg-sky-500 text-white font-medium px-6 py-2.5 rounded-xl text-sm transition shadow-lg shadow-sky-600/30">
                    შემდეგი კითხვა ➡️
                </button>
            </div>
        </div>

        <!-- საბოლოო შედეგის ეკრანი (თავიდან დამალულია) -->
        <div id="result-container" class="hidden text-center py-6 space-y-5">
            <div class="text-5xl">🏆</div>
            <h2 class="text-2xl font-bold text-white">ვიქტორინა დასრულდა!</h2>
            <p id="final-score-text" class="text-slate-300 text-lg">
                თქვენ დააგროვეთ 0 ქულა!
            </p>
            <button id="restart-btn"
                class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-6 py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-600/30">
                🔄 თავიდან დაწყება
            </button>
        </div>

    </div>

    <!-- JavaScript ფაილის მიბმა -->
    <script src="script.js"></script>
</body>

</html>
